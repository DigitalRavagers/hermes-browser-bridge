<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      margin: 0;
      color: #1f2937;
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }
    header {
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #0b1020;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; }
    .badge {
      font-size: 10px; padding: 2px 6px; border-radius: 999px; background: #14b8a6; color: #fff;
    }
    .status { padding: 10px 14px; font-size: 12px; color: #374151; }
    .status.ok { color: #047857; }
    .status.err { color: #b91c1c; }
    .idle { padding: 14px; font-size: 12px; color: #6b7280; }
    .actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #f3f4f6; }
    button {
      flex: 1;
      font: inherit; font-size: 12px; font-weight: 600;
      padding: 7px 8px; border: 0; border-radius: 8px; cursor: pointer;
      background: #111827; color: #fff;
    }
    button:hover { background: #111827f0; }
    button.ghost { background: #f3f4f6; color: #111827; }
  </style>
</head>
<body>
  <header>
    <h1>Hermes Browser Bridge</h1>
    <span class="badge">v0.1</span>
  </header>
  <section>
    <div id="status" class="status">Checking bridge…</div>
    <div id="screenshot" class="idle">Screenshot preview</div>
  </section>
  <section class="actions">
    <button id="BtnCapture">Capture page</button>
    <button id="BtnCopyUrl" class="ghost">Copy URL</button>
  </section>
  <script src="popup.js"></script>
</body>
</html>
